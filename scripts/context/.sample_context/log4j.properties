# ==============================
# ✅ Clean Dynamic Spark Logging Configuration (Final Version)
# ==============================

# Set the root logger level dynamically, default to INFO if missing
log4j.rootCategory=INFO, file

# Configure the rolling file appender
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/test_sanity_logs/spark-master.log
log4j.appender.file.MaxFileSize=100MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss}] [%p] %c{1}: %m%n

# Quiet Spark internals a bit to avoid noisy logs
log4j.logger.org.apache.spark=INFO
log4j.logger.org.apache.spark.scheduler.TaskSetManager=ERROR
log4j.logger.org.apache.spark.storage.BlockManager=ERROR
log4j.logger.org.apache.spark.executor.Executor=ERROR

# Optional: slightly quiet Akka and Jetty internals if you see noise
log4j.logger.org.spark_project.jetty=WARN
log4j.logger.org.spark_project.jetty.util.component.AbstractLifeCycle=ERROR
log4j.logger.org.apache.hadoop=WARN
log4j.logger.io.netty=WARN

